services:
  firewall:
    image: blender-assets-firewall:local
    build:
      context: .
      dockerfile: deployment/firewall.Dockerfile
    platform: linux/arm64
    cap_drop: [ALL]
    cap_add: [NET_ADMIN]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, "iptables -C OUTPUT -p tcp --dport 443 -j ACCEPT && iptables -C OUTPUT -d 10.0.0.0/8 -j DROP && ip6tables -S OUTPUT | grep -q -- '-P OUTPUT DROP'"]
      interval: 2s
      timeout: 2s
      retries: 5

  server:
    image: blender-assets-server:local
    profiles: [server]
    build: .
    platform: linux/arm64
    network_mode: service:firewall
    depends_on:
      firewall:
        condition: service_healthy
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=768m,mode=1777
    environment:
      BLENDER_ASSETS_CACHE: ${ASSET_CACHE_DIR:?Set ASSET_CACHE_DIR to an absolute dedicated cache path}
      HOME: /tmp
    volumes:
      - type: bind
        source: ${ASSET_CACHE_DIR:?Set ASSET_CACHE_DIR to an absolute dedicated cache path}
        target: ${ASSET_CACHE_DIR:?Set ASSET_CACHE_DIR to an absolute dedicated cache path}
        bind:
          create_host_path: false
    pids_limit: 128
    mem_limit: 1g
    cpus: 2
    stdin_open: true
    tty: false
